name: geomute
description: A Flutter app that automatically switches phone to silent mode based on geolocation.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^10.1.0
  shared_preferences: ^2.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  permission_handler: ^11.0.1
  sound_mode: ^3.1.1
  geocoding: ^2.1.1
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "Logo.png"